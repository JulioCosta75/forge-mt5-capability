            $editor = Join-Path $Install "metaeditor64.exe"
            $include = Join-Path $Install "MQL5"
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $editor
            $psi.Arguments = '/compile:"{0}" /log:"{1}" /include:"{2}"' -f $source, $logPath, $include
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $psi
            [void]$proc.Start()
            [void]$proc.WaitForExit()
            $sibling = Join-Path (Split-Path $source -Parent) (([System.IO.Path]::GetFileNameWithoutExtension($source)) + ".log")
            $logDeadline = (Get-Date).AddSeconds(60)
            $lastLen = [int64]-1
            $stableLen = 0
            while ((Get-Date) -lt $logDeadline) {
              $candidate = $null
              if (Test-Path $logPath) { $candidate = $logPath }
              elseif (Test-Path $sibling) { $candidate = $sibling }
              if ($candidate) {
                $len = [int64](Get-Item $candidate).Length
                if ($len -gt 0 -and $len -eq $lastLen) {
                  $stableLen++
                  if ($stableLen -ge 2) { break }
                } else { $stableLen = 0 }
                $lastLen = $len
              }
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $logPath) -and (Test-Path $sibling)) {
              Copy-Item $sibling $logPath -Force
            }
            if (-not (Test-Path $logPath)) { throw "P3: log de compilacao ausente" }
            return [int]$proc.ExitCode
          }

          function Get-LabeledValue([string]$text, [string]$label) {
            $plain = $text.Replace("&nbsp;", " ").Replace("&#160;", " ")
            $plain = [regex]::Replace($plain, "(?is)<script.*?</script>", " ")
            $plain = [regex]::Replace($plain, "(?s)<[^>]+>", "`n")
            $lines = New-Object System.Collections.Generic.List[string]
            foreach ($part in ($plain -split "`n")) {
              $trim = $part.Trim()
              if ($trim.Length -gt 0) { $lines.Add($trim) }
            }
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              $bare = $line.TrimEnd(":").Trim()
              if ([string]::Equals($bare, $label, [System.StringComparison]::OrdinalIgnoreCase)) {
                if ($i + 1 -lt $lines.Count) { return $lines[$i + 1] }
                return $null
              }
              $prefix = $label + ":"
              if ($line.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                return $line.Substring($prefix.Length).Trim()
              }
            }
            return $null
          }

          function Find-Report([string]$name) {
            $roots = @($Install, (Join-Path $env:APPDATA "MetaQuotes"))
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Filter $name -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($hit) { return $hit.FullName }
            }
            return $null
          }

          function Write-TesterIni([string]$path, [string]$stem) {
            $login = [Environment]::GetEnvironmentVariable("MT5_DEMO_LOGIN")
            $password = [Environment]::GetEnvironmentVariable("MT5_DEMO_PASSWORD")
            $server = [Environment]::GetEnvironmentVariable("MT5_DEMO_SERVER")
            $lines = @(
              "[Common]",
              ("Login={0}" -f $login),
              ("Password={0}" -f $password),
              ("Server={0}" -f $server),
              "ProxyEnable=0",
              "NewsEnable=0",
              "",
              "[Experts]",
              "AllowLiveTrading=0",
              "AllowDllImport=0",
              "Enabled=1",
              "",
              "[Tester]",
              "Expert=ForgeSynthMA",
              "Symbol=EURUSD",
              "Period=H1",
              "Model=1",
              "ExecutionMode=0",
              "Optimization=0",
              "FromDate=2024.01.02",
              "ToDate=2024.02.02",
              "ForwardMode=0",
              "Deposit=10000",
              "Currency=USD",
              "Leverage=1:100",
              "UseLocal=1",
              "UseRemote=0",
              "UseCloud=0",
              "Visual=0",
              ("Report=reports\{0}" -f $stem),
              "ReplaceReport=1",
              "ShutdownTerminal=1"
            )
            [System.IO.File]::WriteAllLines($path, $lines, $utf8)
          }

          function Invoke-Tester([string]$stem) {
            $ini = Join-Path $PrivateDir "$stem.ini"
            New-Item -ItemType Directory -Force -Path (Join-Path $Install "reports") | Out-Null
            Write-TesterIni $ini $stem
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = Join-Path $Install "terminal64.exe"
            $psi.Arguments = "/portable /config:$ini"
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $psi
            [void]$proc.Start()
            $deadline = (Get-Date).AddMinutes(20)
            $found = $null
            while ((Get-Date) -lt $deadline) {
              $found = Find-Report "$stem.htm"
              $running = @(Get-Process -Name terminal64,metatester64 -ErrorAction SilentlyContinue)
              if ($found -and $running.Count -eq 0) { break }
              if ($proc.HasExited -and $found) { break }
              Start-Sleep -Seconds 5
            }
            Get-Process -Name terminal64,metatester64 -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            if (-not $found) { $found = Find-Report "$stem.htm" }
            if (-not $found) { throw "P3: relatorio $stem.htm ausente" }
            return $found
          }

          function Read-Metrics([string]$path) {
            $text = Read-TextFile $path
            $profit = Get-LabeledValue $text "Total Net Profit"
            $trades = Get-LabeledValue $text "Total Trades"
            $draw = Get-LabeledValue $text "Equity Drawdown Maximal"
            $label = "Equity Drawdown Maximal"
            if ([string]::IsNullOrWhiteSpace($draw)) {
              $draw = Get-LabeledValue $text "Balance Drawdown Maximal"
              $label = "Balance Drawdown Maximal"
            }
            if ([string]::IsNullOrWhiteSpace($profit) -or [string]::IsNullOrWhiteSpace($trades) -or [string]::IsNullOrWhiteSpace($draw)) {
              throw "P3: relatorio sem profit, trades ou drawdown"
            }
            return [pscustomobject]@{
              profit = (Hide $profit)
              trades = (Hide $trades)
              drawdown = (Hide $draw)
              drawdown_label = $label
            }
          }

          try {
            Install-OfficialMt5
            $experts = Join-Path $Install "MQL5\Experts"
            New-Item -ItemType Directory -Force -Path $experts | Out-Null
            $source = Join-Path $experts "ForgeSynthMA.mq5"
            Copy-Item (Join-Path (Get-Location) "ea\ForgeSynthMA.mq5") $source -Force
            $log = Join-Path $OutDir "ForgeSynthMA.log"
            $code = Invoke-MetaEditor $source $log
            $text = Read-TextFile $log
            $zero = $text -match '(?i)\b0\s+errors?\b'
            $positive = $text -match '(?i)(?<![\d])[1-9]\d*\s+errors?\b'
            $ex5 = Join-Path $experts "ForgeSynthMA.ex5"
            $ex5ok = (Test-Path $ex5) -and ((Get-Item $ex5).Length -gt 0)
            if (-not $zero -or $positive -or -not $ex5ok) {
              throw "P3: compilacao nao aceite (exit=$code)"
            }
            Copy-Item $ex5 (Join-Path $OutDir "ForgeSynthMA.ex5") -Force
            $report1 = Invoke-Tester "run1"
            $report2 = Invoke-Tester "run2"
            Copy-Item $report1 (Join-Path $OutDir "run1.htm") -Force
            Copy-Item $report2 (Join-Path $OutDir "run2.htm") -Force
            $m1 = Read-Metrics (Join-Path $OutDir "run1.htm")
            $m2 = Read-Metrics (Join-Path $OutDir "run2.htm")
            foreach ($copied in @((Join-Path $OutDir "run1.htm"), (Join-Path $OutDir "run2.htm"), $log)) {
              $redacted = Hide (Read-TextFile $copied)
              [System.IO.File]::WriteAllText($copied, $redacted, $utf8)
            }
            $payload1 = [ordered]@{
              run = "1"
              symbol = "EURUSD"
              period = "H1"
              model = 1
              from = "2024.01.02"
              to = "2024.02.02"
              trades = $m1.trades
              profit = $m1.profit
              drawdown = $m1.drawdown
              drawdown_label = $m1.drawdown_label
            }
            $payload2 = [ordered]@{
              run = "2"
              symbol = "EURUSD"
              period = "H1"
              model = 1
              from = "2024.01.02"
              to = "2024.02.02"
              trades = $m2.trades
              profit = $m2.profit
              drawdown = $m2.drawdown
              drawdown_label = $m2.drawdown_label
            }
            [System.IO.File]::WriteAllText((Join-Path $OutDir "run1.json"), (($payload1 | ConvertTo-Json) + "`n"), $utf8)
            [System.IO.File]::WriteAllText((Join-Path $OutDir "run2.json"), (($payload2 | ConvertTo-Json) + "`n"), $utf8)
            $same = ($m1.trades -eq $m2.trades) -and ($m1.profit -eq $m2.profit) -and ($m1.drawdown -eq $m2.drawdown) -and ($m1.drawdown_label -eq $m2.drawdown_label)
            $cmp = [ordered]@{ equal = [bool]$same; trades = $m1.trades; profit = $m1.profit; drawdown = $m1.drawdown }
            [System.IO.File]::WriteAllText((Join-Path $OutDir "comparacao.json"), (($cmp | ConvertTo-Json) + "`n"), $utf8)
            if (-not $same) { throw "P3: os dois runs nao reproduziram profit, trades e drawdown" }
            [System.IO.File]::WriteAllText((Join-Path $OutDir "resultado.txt"), "p3: relatorios reproduzidos`n", $utf8)
          } catch {
            $failed = $true
            [System.IO.File]::WriteAllText((Join-Path $OutDir "resultado.txt"), ("p3: falhou`n{0}`n" -f (Hide $_.Exception.Message)), $utf8)
            Write-Output (Hide $_.Exception.Message)
          } finally {
            Get-Process -Name terminal64,metatester64,metaeditor64 -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Manifest $OutDir
            if (Test-Path $PrivateDir) {
              Remove-Item $PrivateDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          if ($failed) { exit 1 }

      - name: Artefactos P3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-strategy-tester
          path: artifacts/p3
          if-no-files-found: warn
