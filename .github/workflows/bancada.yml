  P3:
    name: P3 strategy tester
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verificar segredos demo
        id: demo
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("MT5_DEMO_LOGIN", "MT5_DEMO_PASSWORD", "MT5_DEMO_SERVER")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrEmpty($value)) {
              Write-Output ("::add-mask::{0}" -f $value)
            }
          }
          $login = [Environment]::GetEnvironmentVariable("MT5_DEMO_LOGIN")
          $password = [Environment]::GetEnvironmentVariable("MT5_DEMO_PASSWORD")
          $server = [Environment]::GetEnvironmentVariable("MT5_DEMO_SERVER")
          $missing = [string]::IsNullOrWhiteSpace($login) -or [string]::IsNullOrWhiteSpace($password) -or [string]::IsNullOrWhiteSpace($server)
          $outDir = Join-Path (Get-Location) "artifacts\p3"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          if ($missing) {
            $utf8 = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::WriteAllText((Join-Path $outDir "resultado.txt"), "skipped: demo secrets ausentes`n", $utf8)
            $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $outDir "resultado.txt")).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText((Join-Path $outDir "MANIFEST.sha256"), ("{0}  resultado.txt`n" -f $hash), $utf8)
            Write-Output "skipped: demo secrets ausentes"
            "skipped=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "segredos demo presentes"
            "skipped=false" >> $env:GITHUB_OUTPUT
          }

