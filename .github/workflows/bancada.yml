            $zeros = 0
            $limit = [Math]::Min(200, $bytes.Length)
            for ($i = 1; $i -lt $limit; $i += 2) {
              $pairs++
              if ($bytes[$i] -eq 0) { $zeros++ }
            }
            if ($pairs -gt 20 -and $zeros -gt ($pairs * 0.6)) {
              return [System.Text.Encoding]::Unicode.GetString($bytes)
            }
            return [System.Text.Encoding]::UTF8.GetString($bytes)
          }
          Show-Artifact "installer-signature.txt"
          Show-Artifact "resultado.txt"
          Show-Artifact "MANIFEST.sha256"
          $log = Join-Path $OutDir "ForgeSynthMA_erro.log"
          Write-Output "----- log compilacao (error|warning|result, max 50) -----"
          if (-not (Test-Path -LiteralPath $log)) {
            Write-Output "ausente"
          } else {
            $text = Read-TextFile $log
            $hits = New-Object System.Collections.Generic.List[string]
            foreach ($line in ($text -split '\r?\n')) {
              if ($line -match '(?i)error|warning|result') { $hits.Add($line) }
            }
            $shown = [Math]::Min(50, $hits.Count)
            for ($i = 0; $i -lt $shown; $i++) { Write-Output $hits[$i] }
            if ($hits.Count -eq 0) { Write-Output "nenhuma linha" }
            if ($hits.Count -gt 50) { Write-Output ("limite: 50 de {0}" -f $hits.Count) }
          }

  P3:
    name: P3 strategy tester
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verificar segredos demo
        id: demo
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("MT5_DEMO_LOGIN", "MT5_DEMO_PASSWORD", "MT5_DEMO_SERVER")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrEmpty($value)) {
              Write-Output ("::add-mask::{0}" -f $value)
            }
          }
          $login = [Environment]::GetEnvironmentVariable("MT5_DEMO_LOGIN")
          $password = [Environment]::GetEnvironmentVariable("MT5_DEMO_PASSWORD")
          $server = [Environment]::GetEnvironmentVariable("MT5_DEMO_SERVER")
          $missing = [string]::IsNullOrWhiteSpace($login) -or [string]::IsNullOrWhiteSpace($password) -or [string]::IsNullOrWhiteSpace($server)
          $outDir = Join-Path (Get-Location) "artifacts\p3"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          if ($missing) {
            $utf8 = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::WriteAllText((Join-Path $outDir "resultado.txt"), "skipped: demo secrets ausentes`n", $utf8)
            [System.IO.File]::WriteAllText((Join-Path $outDir "diagnostico.txt"), "diagnostico: terminal nao instalado`nprocesso: nao iniciado`n", $utf8)
            $sb = New-Object System.Text.StringBuilder
            foreach ($name in @("diagnostico.txt", "resultado.txt")) {
              $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $outDir $name)).Hash.ToLowerInvariant()
              [void]$sb.AppendLine(("{0}  {1}" -f $hash, $name))
            }
            [System.IO.File]::WriteAllText((Join-Path $outDir "MANIFEST.sha256"), $sb.ToString(), $utf8)
            Write-Output "skipped: demo secrets ausentes"
            "skipped=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "segredos demo presentes"
            "skipped=false" >> $env:GITHUB_OUTPUT
          }

      - name: Strategy Tester
        id: tester
        if: steps.demo.outputs.skipped == 'false'
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("MT5_DEMO_LOGIN", "MT5_DEMO_PASSWORD", "MT5_DEMO_SERVER")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrEmpty($value)) {
              Write-Output ("::add-mask::{0}" -f $value)
            }
          }
          $InstallerUrl = "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe?utm_source=www.metatrader5.com&utm_campaign=download"
          $Install = "C:\mt5-bancada"
          $OutDir = Join-Path (Get-Location) "artifacts\p3"
          $PrivateDir = "C:\bancada-private"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          New-Item -ItemType Directory -Force -Path $PrivateDir | Out-Null
          $failed = $false
          $utf8 = New-Object System.Text.UTF8Encoding $false

          function Hide([string]$text) {
            if ($null -eq $text) { return $text }
            foreach ($name in @("MT5_DEMO_LOGIN", "MT5_DEMO_PASSWORD", "MT5_DEMO_SERVER")) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if (-not [string]::IsNullOrEmpty($value) -and $value.Length -ge 3) {
                $text = $text.Replace($value, "[redacted]")
              }
            }
            return $text
          }

          function Write-Manifest([string]$dir) {
            $manifest = Join-Path $dir "MANIFEST.sha256"
            if (Test-Path $manifest) { Remove-Item $manifest -Force }
            $files = @(Get-ChildItem -Path $dir -File | Where-Object { $_.Name -ne "MANIFEST.sha256" } | Sort-Object Name)
            $sb = New-Object System.Text.StringBuilder
            foreach ($file in $files) {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
              [void]$sb.AppendLine(("{0}  {1}" -f $hash, $file.Name))
            }
            [System.IO.File]::WriteAllText($manifest, $sb.ToString(), $utf8)
          }

          function Read-TextFile([string]$path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -ge 2 -and $bytes[0] -eq 255 -and $bytes[1] -eq 254) {
              return [System.Text.Encoding]::Unicode.GetString($bytes)
            }
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191) {
              return [System.Text.Encoding]::UTF8.GetString($bytes, 3, $bytes.Length - 3)
            }
            $pairs = 0
            $zeros = 0
            $limit = [Math]::Min(200, $bytes.Length)
            for ($i = 1; $i -lt $limit; $i += 2) {
              $pairs++
              if ($bytes[$i] -eq 0) { $zeros++ }
            }
            if ($pairs -gt 20 -and $zeros -gt ($pairs * 0.6)) {
              return [System.Text.Encoding]::Unicode.GetString($bytes)
            }
            return [System.Text.Encoding]::UTF8.GetString($bytes)
          }

          function Install-OfficialMt5 {
            $setupDir = "C:\mt5-bancada-setup"
            New-Item -ItemType Directory -Force -Path $setupDir | Out-Null
            $setup = Join-Path $setupDir "mt5setup.exe"
            $ProgressPreference = "SilentlyContinue"
            $response = Invoke-WebRequest -Uri $InstallerUrl -OutFile $setup -UseBasicParsing -PassThru
            $effectiveUrl = $InstallerUrl
            try {
              if ($null -ne $response -and $null -ne $response.BaseResponse) {
                $base = $response.BaseResponse
                $candidate = $null
                if ($null -ne $base.RequestMessage -and $null -ne $base.RequestMessage.RequestUri) {
                  $candidate = [string]$base.RequestMessage.RequestUri.AbsoluteUri
                }
                if ([string]::IsNullOrWhiteSpace($candidate)) {
                  $prop = $base.PSObject.Properties["ResponseUri"]
                  if ($null -ne $prop -and $null -ne $prop.Value) {
                    $candidate = [string]$prop.Value.AbsoluteUri
                  }
                }
                if (-not [string]::IsNullOrWhiteSpace($candidate)) { $effectiveUrl = $candidate }
              }
            } catch {
              $effectiveUrl = $InstallerUrl
            }
            $head = [System.IO.File]::ReadAllBytes($setup)
            $mzOk = ($head.Length -ge 2 -and $head[0] -eq 0x4D -and $head[1] -eq 0x5A)
            $hash = (Get-FileHash -Algorithm SHA256 -Path $setup).Hash.ToLowerInvariant()
            $status = "indisponivel"
            $subject = ""
            $thumb = ""
            try {
              $sig = Get-AuthenticodeSignature -FilePath $setup
              $status = [string]$sig.Status
              if ($null -ne $sig.SignerCertificate) {
                $subject = [string]$sig.SignerCertificate.Subject
                $thumb = [string]$sig.SignerCertificate.Thumbprint
              }
            } catch {
              $detail = Hide ([string]$_.Exception.Message)
              $detail = $detail -replace '\s+', ' '
              if ($detail.Length -gt 180) { $detail = $detail.Substring(0, 180) }
              $status = "erro: " + $detail
            }
            $subjectOk = $subject.Contains("MetaQuotes")
            $sigBody = @(
              ("sha256: {0}" -f $hash),
              ("status: {0}" -f $status),
              ("subject: {0}" -f $subject),
              ("thumbprint: {0}" -f $thumb),
              ("url: {0}" -f $effectiveUrl)
            ) -join "`n"
            $sigText = Hide ($sigBody + "`n")
            [System.IO.File]::WriteAllText((Join-Path $OutDir "installer-signature.txt"), $sigText, $utf8)
            [System.IO.File]::WriteAllText((Join-Path $OutDir "installer.sha256"), ("{0}  mt5setup.exe`n" -f $hash), $utf8)
            Write-Output "installer-signature:"
            Write-Output $sigText
            if (-not $mzOk) {
              throw "P3: o ficheiro descarregado nao tem assinatura PE; o instalador nao foi executado"
            }
            if ($status -ne "Valid" -or -not $subjectOk) {
              throw "P3: assinatura Authenticode recusada; o instalador nao foi executado"
            }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $setup
            $psi.Arguments = "/auto /path:$Install"
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $psi
            [void]$proc.Start()
            $deadline = (Get-Date).AddMinutes(15)
            $editor = Join-Path $Install "metaeditor64.exe"
            $terminal = Join-Path $Install "terminal64.exe"
            foreach ($path in @($editor, $terminal)) {
              $last = [int64]-1
              $stable = 0
              $ready = $false
              while ((Get-Date) -lt $deadline) {
                if (Test-Path $path) {
                  $len = [int64](Get-Item $path).Length
                  if ($len -gt 1000000 -and $len -eq $last) {
                    $stable++
                    if ($stable -ge 3) { $ready = $true; break }
                  } else { $stable = 0 }
                  $last = $len
                } else { $stable = 0; $last = [int64]-1 }
                Start-Sleep -Seconds 5
              }
              if (-not $ready) { throw "P3: $path nao ficou pronto" }
            }
            Get-Process -Name mt5setup,terminal64,metaeditor64,metatester64 -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item $setup -Force
            $listing = @(Get-ChildItem -Path $Install | Select-Object -ExpandProperty Name)
            [System.IO.File]::WriteAllText((Join-Path $OutDir "install-dir.txt"), (($listing -join "`n") + "`n"), $utf8)
          }

          function Invoke-MetaEditor([string]$source, [string]$logPath) {
            $editor = Join-Path $Install "metaeditor64.exe"
            $include = Join-Path $Install "MQL5"
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $editor
            $psi.Arguments = '/compile:"{0}" /log:"{1}" /include:"{2}"' -f $source, $logPath, $include
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $psi
            [void]$proc.Start()
            [void]$proc.WaitForExit()
            $sibling = Join-Path (Split-Path $source -Parent) (([System.IO.Path]::GetFileNameWithoutExtension($source)) + ".log")
            $logDeadline = (Get-Date).AddSeconds(60)
            $lastLen = [int64]-1
            $stableLen = 0
            while ((Get-Date) -lt $logDeadline) {
              $candidate = $null
              if (Test-Path $logPath) { $candidate = $logPath }
              elseif (Test-Path $sibling) { $candidate = $sibling }
              if ($candidate) {
                $len = [int64](Get-Item $candidate).Length
                if ($len -gt 0 -and $len -eq $lastLen) {
                  $stableLen++
                  if ($stableLen -ge 2) { break }
                } else { $stableLen = 0 }
                $lastLen = $len
              }
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $logPath) -and (Test-Path $sibling)) {
              Copy-Item $sibling $logPath -Force
            }
            if (-not (Test-Path $logPath)) { throw "P3: log de compilacao ausente" }
            return [int]$proc.ExitCode
          }

          function Get-LabeledValue([string]$text, [string]$label) {
            $plain = $text.Replace("&nbsp;", " ").Replace("&#160;", " ")
            $plain = [regex]::Replace($plain, "(?is)<script.*?</script>", " ")
            $plain = [regex]::Replace($plain, "(?s)<[^>]+>", "`n")
            $lines = New-Object System.Collections.Generic.List[string]
            foreach ($part in ($plain -split "`n")) {
              $trim = $part.Trim()
              if ($trim.Length -gt 0) { $lines.Add($trim) }
            }
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              $bare = $line.TrimEnd(":").Trim()
              if ([string]::Equals($bare, $label, [System.StringComparison]::OrdinalIgnoreCase)) {
                if ($i + 1 -lt $lines.Count) { return $lines[$i + 1] }
                return $null
              }
              $prefix = $label + ":"
              if ($line.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                return $line.Substring($prefix.Length).Trim()
              }
            }
            return $null
          }

          function Test-ForbiddenName([string]$name) {
            $lower = $name.ToLowerInvariant()
            if ($lower -eq "tester.ini") { return $true }
            if ($lower -eq "accounts.dat") { return $true }
            if ($lower.EndsWith(".srv")) { return $true }
            if ($lower.EndsWith(".ini")) { return $true }
            return $false
          }

          function Redact-Text([string]$text) {
            if ($null -eq $text) { return "" }
            $hidden = Hide $text
            $kept = New-Object System.Collections.Generic.List[string]
            foreach ($line in ($hidden -split '\r?\n')) {
              $drop = $false
              foreach ($secretName in @("MT5_DEMO_LOGIN", "MT5_DEMO_PASSWORD", "MT5_DEMO_SERVER")) {
                $value = [Environment]::GetEnvironmentVariable($secretName)
                if (-not [string]::IsNullOrEmpty($value) -and $line.Contains($value)) { $drop = $true; break }
              }
              if (-not $drop) { [void]$kept.Add($line) }
            }
            return ($kept -join "`n")
          }

          function Get-P3LogFiles {
            $found = New-Object System.Collections.Generic.List[System.IO.FileInfo]
            $dirs = New-Object System.Collections.Generic.List[string]
            [void]$dirs.Add((Join-Path $Install "logs"))
            [void]$dirs.Add((Join-Path $Install "Tester\logs"))
            $testerRoot = Join-Path $Install "Tester"
            if (Test-Path $testerRoot) {
              foreach ($sub in @(Get-ChildItem -Path $testerRoot -Directory -ErrorAction SilentlyContinue)) {
                [void]$dirs.Add((Join-Path $sub.FullName "logs"))
              }
            }
            foreach ($dir in $dirs) {
              if (-not (Test-Path $dir)) { continue }
              foreach ($file in @(Get-ChildItem -Path $dir -Filter *.log -File -ErrorAction SilentlyContinue)) {
                if (Test-ForbiddenName $file.Name) { continue }
                [void]$found.Add($file)
              }
            }
            return @($found | Sort-Object -Property FullName)
          }

          function Test-LoginRefused {
            foreach ($file in @(Get-P3LogFiles)) {
              $raw = Read-TextFile $file.FullName
              foreach ($line in ($raw -split '\r?\n')) {
                if ($line -match '(?i)authorization failed') { return $true }
                if ($line -match '(?i)authorization on .+ failed') { return $true }
                if ($line -match '(?i)invalid account') { return $true }
                if ($line -match '(?i)\blogin failed\b') { return $true }
                if ($line -match '(?i)autoriza[cç][aã]o falh') { return $true }
                if ($line -match '(?i)falha de autoriza') { return $true }
              }
            }
            return $false
          }

          function Stop-TerminalProcesses {
            Get-Process -Name terminal64,metatester64 -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          function Get-P3ReportListing {
            $rows = New-Object System.Collections.Generic.List[string]
            $roots = @($Install, (Join-Path $env:APPDATA "MetaQuotes"))
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $files = @(Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Extension -match '(?i)^\.(htm|html|xml)$' } |
                Sort-Object -Property FullName)
              foreach ($file in $files) {
                if (Test-ForbiddenName $file.Name) { continue }
                $clean = (Redact-Text ("{0}  {1}" -f $file.Length, $file.FullName)).Trim()
                if (-not [string]::IsNullOrWhiteSpace($clean)) { [void]$rows.Add($clean) }
              }
            }
            return $rows
          }

          function Write-P3Diagnostic {
            $sb = New-Object System.Text.StringBuilder
            [void]$sb.AppendLine("diagnostico p3")
            if ($null -eq $script:runNotes -or $script:runNotes.Count -eq 0) {
              [void]$sb.AppendLine("processo: nao iniciado")
            } else {
              foreach ($note in $script:runNotes) { [void]$sb.AppendLine([string]$note) }
            }
            [void]$sb.AppendLine("")
            [void]$sb.AppendLine("----- logs (ultimas 80 linhas) -----")
            $logFiles = @(Get-P3LogFiles)
            if ($logFiles.Count -eq 0) {
              [void]$sb.AppendLine("logs: ausentes")
            } else {
              foreach ($file in $logFiles) {
                [void]$sb.AppendLine(("== {0} ==" -f $file.FullName))
                $raw = Read-TextFile $file.FullName
                $lines = @($raw -split '\r?\n')
                $start = 0
                if ($lines.Count -gt 80) { $start = $lines.Count - 80 }
                $tail = New-Object System.Collections.Generic.List[string]
                for ($i = $start; $i -lt $lines.Count; $i++) { [void]$tail.Add([string]$lines[$i]) }
                [void]$sb.AppendLine((Redact-Text ($tail -join "`n")))
              }
            }
            [void]$sb.AppendLine("")
            [void]$sb.AppendLine("----- htm html xml (nome e tamanho) -----")
            $reports = @(Get-P3ReportListing)
            if ($reports.Count -eq 0) {
              [void]$sb.AppendLine("relatorios: ausentes")
            } else {
              foreach ($row in $reports) { [void]$sb.AppendLine([string]$row) }
            }
            [void]$sb.AppendLine("")
            [void]$sb.AppendLine("----- logs (linhas com report) -----")
            $reportLineFiles = @(Get-P3LogFiles)
            $anyReportLine = $false
            foreach ($file in $reportLineFiles) {
              $raw = Read-TextFile $file.FullName
              $hits = New-Object System.Collections.Generic.List[string]
              foreach ($line in ($raw -split '\r?\n')) {
                if ($line -match '(?i)report') { [void]$hits.Add([string]$line) }
              }
              if ($hits.Count -eq 0) { continue }
              $anyReportLine = $true
              $shown = Format-RelativeSize $Install $file.FullName "install" ([int64]$file.Length)
              $logLabel = "install\log"
              if (-not [string]::IsNullOrWhiteSpace($shown)) {
                $splitAt = $shown.IndexOf("  ")
                if ($splitAt -ge 0 -and ($splitAt + 2) -lt $shown.Length) { $logLabel = $shown.Substring($splitAt + 2) }
              }
              [void]$sb.AppendLine(("== {0} ==" -f $logLabel))
              [void]$sb.AppendLine((Redact-Text ($hits -join "`n")))
            }
            if (-not $anyReportLine) { [void]$sb.AppendLine("linhas com report: ausentes") }
            [void]$sb.AppendLine("")
            [void]$sb.AppendLine("----- ficheiros htm html xml png posteriores ao arranque (caminho relativo e tamanho) -----")
            if ($null -eq $script:runStarts -or $script:runStarts.Count -eq 0) {
              [void]$sb.AppendLine("arranques: nenhum")
            } else {
              foreach ($run in $script:runStarts) {
                [void]$sb.AppendLine(("== {0} ==" -f $run.stem))
                $changed = @(Get-ChangedReportFiles ([datetime]$run.started))
                if ($changed.Count -eq 0) {
                  [void]$sb.AppendLine("ficheiros posteriores: ausentes")
                } else {
                  foreach ($row in $changed) { [void]$sb.AppendLine([string]$row) }
                }
              }
            }
            $text = Redact-Text ($sb.ToString())
            if (-not $text.EndsWith("`n")) { $text = $text + "`n" }
            [System.IO.File]::WriteAllText((Join-Path $OutDir "diagnostico.txt"), $text, $utf8)
            Write-Output "----- diagnostico -----"
            Write-Output $text
          }

          function Remove-ArtifactFile([string]$path) {
            if (-not (Test-Path -LiteralPath $path)) { return }
            $item = Get-Item -LiteralPath $path -Force
            if ($item.IsReadOnly) { $item.IsReadOnly = $false }
            Remove-Item -LiteralPath $path -Force -ErrorAction Stop
            if (Test-Path -LiteralPath $path) { throw "P3: ficheiro por redigir permanece" }
          }

          function Try-SanitizeFile([string]$path) {
            try {
              $item = Get-Item -LiteralPath $path -Force
              if ($item.IsReadOnly) { $item.IsReadOnly = $false }
              $clean = Redact-Text (Read-TextFile $path)
              if (-not $clean.EndsWith("`n")) { $clean = $clean + "`n" }
              [System.IO.File]::WriteAllText($path, $clean, $utf8)
              return "redacted"
            } catch {
              Write-Host (Redact-Text ([string]$_.Exception.Message))
              try {
                Remove-ArtifactFile $path
                Write-Host ("removido apos falha de redacao: {0}" -f (Split-Path -Leaf $path))
                return "removed"
              } catch {
                $script:redactionUnsafe = $true
                Write-Host ("P3: redacao falhou e o ficheiro permanece: {0}" -f (Split-Path -Leaf $path))
                return "unsafe"
              }
            }
          }

          function Redact-OutDir {
            if (-not (Test-Path $OutDir)) { return }
            $allowed = @(".htm", ".html", ".xml", ".log", ".txt", ".json", ".csv")
            foreach ($file in @(Get-ChildItem -Path $OutDir -File -Force)) {
              if (Test-ForbiddenName $file.Name) {
                try { Remove-ArtifactFile $file.FullName } catch { $script:redactionUnsafe = $true }
                continue
              }
              $ext = $file.Extension.ToLowerInvariant()
              if ($allowed -notcontains $ext) { continue }
              $state = Try-SanitizeFile $file.FullName
              if ($state -eq "removed") { $script:redactionRemoved = $true }
            }
          }

          function Find-Report([string]$stem) {
            $names = @("$stem.htm", "$stem.html", "$stem.xml")
            $direct = Join-Path $Install "reports"
            foreach ($name in $names) {
              if (Test-ForbiddenName $name) { continue }
              $candidate = Join-Path $direct $name
              if (Test-Path -LiteralPath $candidate) { return (Resolve-Path -LiteralPath $candidate).Path }
            }
            $roots = @($Install, (Join-Path $env:APPDATA "MetaQuotes"))
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              foreach ($name in $names) {
                if (Test-ForbiddenName $name) { continue }
                $hit = Get-ChildItem -Path $root -Filter $name -Recurse -File -ErrorAction SilentlyContinue |
                  Sort-Object -Property FullName |
                  Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }

          function Format-RelativeSize([string]$root, [string]$fullName, [string]$prefix, [int64]$length) {
            if ([string]::IsNullOrWhiteSpace($root) -or [string]::IsNullOrWhiteSpace($fullName)) { return $null }
            $rootFull = [System.IO.Path]::GetFullPath($root).TrimEnd('\', '/')
            $full = [System.IO.Path]::GetFullPath($fullName)
            $sep = [System.IO.Path]::DirectorySeparatorChar
            $rootWithSep = $rootFull + $sep
            if (-not $full.StartsWith($rootWithSep, [System.StringComparison]::OrdinalIgnoreCase)) { return $null }
            $rel = $full.Substring($rootWithSep.Length) -replace '[\\/]', '\'
            if ([string]::IsNullOrWhiteSpace($rel)) { return $null }
            if ($rel -match '^[A-Za-z]:') { return $null }
            return ("{0}  {1}\{2}" -f $length, $prefix, $rel)
          }

          function Get-ChangedReportFiles([datetime]$since) {
            $rows = New-Object System.Collections.Generic.List[string]
            $roots = @(
              [pscustomobject]@{ Root = $Install; Prefix = "install" },
              [pscustomobject]@{ Root = (Join-Path $env:APPDATA "MetaQuotes"); Prefix = "appdata" }
            )
            foreach ($entry in $roots) {
              if (-not (Test-Path $entry.Root)) { continue }
              $files = @(Get-ChildItem -Path $entry.Root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Extension -match '(?i)^\.(htm|html|xml|png)$' -and
                  $_.LastWriteTime -gt $since -and
                  -not (Test-ForbiddenName $_.Name)
                } |
                Sort-Object -Property FullName)
              foreach ($file in $files) {
                $shown = Format-RelativeSize $entry.Root $file.FullName $entry.Prefix ([int64]$file.Length)
                if ([string]::IsNullOrWhiteSpace($shown)) { continue }
                $clean = (Redact-Text $shown).Trim()
                if (-not [string]::IsNullOrWhiteSpace($clean)) { [void]$rows.Add($clean) }
              }
            }
            return $rows
          }

          function Find-Stats([datetime]$since) {
            $testerRoot = Join-Path $Install "Tester"
            if (-not (Test-Path $testerRoot)) { return $null }
            $hits = New-Object System.Collections.Generic.List[System.IO.FileInfo]
            foreach ($agent in @(Get-ChildItem -Path $testerRoot -Directory -ErrorAction SilentlyContinue)) {
              $candidate = Join-Path (Join-Path (Join-Path $agent.FullName "MQL5") "Files") "forge_p3_stats.csv"
              if (-not (Test-Path -LiteralPath $candidate)) { continue }
              $item = Get-Item -LiteralPath $candidate
              if ($item.LastWriteTime -gt $since) { [void]$hits.Add($item) }
            }
            $ordered = @($hits | Sort-Object -Property LastWriteTime -Descending)
            if ($ordered.Count -eq 0) { return $null }
            return [string]$ordered[0].FullName
          }

          function Copy-Stats([string]$source, [string]$stem) {
            $dest = Join-Path $OutDir ($stem + "-stats.csv")
            Copy-Item -LiteralPath $source -Destination $dest -Force
            $state = Try-SanitizeFile $dest
            if ($state -ne "redacted") { throw "P3: redacao do artefacto falhou" }
            return $dest
          }

          function Test-StatsShape([string]$text) {
            if ([string]::IsNullOrWhiteSpace($text)) { return $false }
            return ($text -match '(?m)^profit,.+$') -and ($text -match '(?m)^trades,.+$') -and ($text -match '(?m)^equity_dd,.+$') -and ($text -match '(?m)^balance_dd,.+$')
          }

          function Test-SameStats([string]$left, [string]$right) {
            if ($null -eq $left -or $null -eq $right) { return $false }
            $a = $left.Trim()
            $b = $right.Trim()
            if (-not (Test-StatsShape $a) -or -not (Test-StatsShape $b)) { return $false }
            return ($a -eq $b)
          }

          function Resolve-RunOutcome([string]$stem, [string]$found, [string]$stats, [bool]$loginRefused) {
            if ((-not $found) -and $loginRefused) {
              return [pscustomobject]@{ stop = $true; reason = "login demo recusado"; copyStats = -not [string]::IsNullOrWhiteSpace($stats) }
            }
            if ((-not $found) -and -not [string]::IsNullOrWhiteSpace($stats)) {
              return [pscustomobject]@{ stop = $true; reason = "relatorio ausente; stats presentes"; copyStats = $true }
            }
            if (-not $found) {
              return [pscustomobject]@{ stop = $true; reason = ("P3: relatorio {0}.htm, {0}.html ou {0}.xml ausente" -f $stem); copyStats = $false }
            }
            if ([string]::IsNullOrWhiteSpace($stats)) {
              return [pscustomobject]@{ stop = $true; reason = ("P3: stats {0} ausentes" -f $stem); copyStats = $false }
            }
            return [pscustomobject]@{ stop = $false; reason = ""; copyStats = $true }
          }

          function Write-TesterIni([string]$path, [string]$stem) {
            $login = [Environment]::GetEnvironmentVariable("MT5_DEMO_LOGIN")
            $password = [Environment]::GetEnvironmentVariable("MT5_DEMO_PASSWORD")
            $server = [Environment]::GetEnvironmentVariable("MT5_DEMO_SERVER")
            $lines = @(
              "[Common]",
              ("Login={0}" -f $login),
              ("Password={0}" -f $password),
              ("Server={0}" -f $server),
              "ProxyEnable=0",
              "NewsEnable=0",
              "",
              "[Experts]",
              "AllowLiveTrading=0",
              "AllowDllImport=0",
              "Enabled=1",
              "",
              "[Tester]",
              "Expert=ForgeSynthMA",
              "Symbol=EURUSD",
              "Period=H1",
              "Model=1",
              "ExecutionMode=0",
              "Optimization=0",
              "FromDate=2024.01.02",
              "ToDate=2024.02.02",
              "ForwardMode=0",
              "Deposit=10000",
              "Currency=USD",
              "Leverage=1:100",
              "UseLocal=1",
              "UseRemote=0",
              "UseCloud=0",
              "Visual=0",
              ("Report=reports\{0}" -f $stem),
              "ReplaceReport=1",
              "ShutdownTerminal=1"
            )
            [System.IO.File]::WriteAllLines($path, $lines, $utf8)
          }

          function Copy-Report([string]$source, [string]$stem) {
            $ext = [System.IO.Path]::GetExtension($source)
            if ([string]::IsNullOrWhiteSpace($ext)) { $ext = ".htm" }
            $dest = Join-Path $OutDir ($stem + $ext.ToLowerInvariant())
            Copy-Item -LiteralPath $source -Destination $dest -Force
            $state = Try-SanitizeFile $dest
            if ($state -ne "redacted") { throw "P3: redacao do artefacto falhou" }
            return $dest
          }

          function Invoke-Tester([string]$stem) {
            $ini = Join-Path $PrivateDir "$stem.ini"
            New-Item -ItemType Directory -Force -Path (Join-Path $Install "reports") | Out-Null
            Write-TesterIni $ini $stem
            $configPath = [System.IO.Path]::GetFullPath($ini)
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = Join-Path $Install "terminal64.exe"
            $psi.Arguments = ('/portable /config:"{0}"' -f $configPath)
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $psi
            $started = Get-Date
            [void]$script:runStarts.Add([pscustomobject]@{ stem = $stem; started = $started })
            [void]$proc.Start()
            $deadline = $started.AddMinutes(45)
            $found = $null
            $disposition = "desconhecido"
            while ((Get-Date) -lt $deadline) {
              $found = Find-Report $stem
              if ($proc.HasExited) {
                $disposition = "terminou sozinho"
                break
              }
              Start-Sleep -Seconds 5
            }
            if (-not $proc.HasExited) {
              Stop-TerminalProcesses
              $disposition = "morto no prazo"
            } elseif ($disposition -eq "desconhecido") {
              $disposition = "terminou sozinho"
            }
            Start-Sleep -Seconds 3
            if (-not $found) { $found = Find-Report $stem }
            $stats = Find-Stats $started
            $loginRefused = (-not $found) -and (Test-LoginRefused)
            $outcome = Resolve-RunOutcome $stem $found $stats $loginRefused
            if ($loginRefused) {
              $script:loginRecusado = $true
              $disposition = "{0}; login demo recusado" -f $disposition
            }
            [void]$script:runNotes.Add(("terminal64 {0}: {1}" -f $stem, $disposition))
            if ($stats) {
              [void]$script:runNotes.Add(("stats {0}: presente" -f $stem))
            } else {
              [void]$script:runNotes.Add(("stats {0}: ausente" -f $stem))
            }
            if ($outcome.copyStats -and $stats) { Copy-Stats $stats $stem | Out-Null }
            if ($outcome.stop) { throw $outcome.reason }
            return $found
          }

          function Read-Metrics([string]$path) {
            $text = Read-TextFile $path
            $profit = Get-LabeledValue $text "Total Net Profit"
            $trades = Get-LabeledValue $text "Total Trades"
            $draw = Get-LabeledValue $text "Equity Drawdown Maximal"
            $label = "Equity Drawdown Maximal"
            if ([string]::IsNullOrWhiteSpace($draw)) {
              $draw = Get-LabeledValue $text "Balance Drawdown Maximal"
              $label = "Balance Drawdown Maximal"
            }
            if ([string]::IsNullOrWhiteSpace($profit) -or [string]::IsNullOrWhiteSpace($trades) -or [string]::IsNullOrWhiteSpace($draw)) {
              throw "P3: relatorio sem profit, trades ou drawdown"
            }
            return [pscustomobject]@{
              profit = (Hide $profit)
              trades = (Hide $trades)
              drawdown = (Hide $draw)
              drawdown_label = $label
            }
          }

          $script:runNotes = New-Object System.Collections.Generic.List[string]
          $script:runStarts = New-Object System.Collections.Generic.List[object]
          $script:loginRecusado = $false
          $script:redactionUnsafe = $false
          $script:redactionRemoved = $false
          try {
            Install-OfficialMt5
            $experts = Join-Path $Install "MQL5\Experts"
            New-Item -ItemType Directory -Force -Path $experts | Out-Null
            $source = Join-Path $experts "ForgeSynthMA.mq5"
            Copy-Item (Join-Path (Get-Location) "ea\ForgeSynthMA.mq5") $source -Force
            $log = Join-Path $OutDir "ForgeSynthMA.log"
            $code = Invoke-MetaEditor $source $log
            $text = Read-TextFile $log
            $zero = $text -match '(?i)\b0\s+errors?\b'
            $positive = $text -match '(?i)(?<![\d])[1-9]\d*\s+errors?\b'
            $ex5 = Join-Path $experts "ForgeSynthMA.ex5"
            $ex5ok = (Test-Path $ex5) -and ((Get-Item $ex5).Length -gt 0)
            if (-not $zero -or $positive -or -not $ex5ok) {
              throw "P3: compilacao nao aceite (exit=$code)"
            }
            Copy-Item $ex5 (Join-Path $OutDir "ForgeSynthMA.ex5") -Force
            # run2 reutiliza o historico ja descarregado; a pasta de instalacao nao e limpa entre runs.
            $report1 = Copy-Report (Invoke-Tester "run1") "run1"
            $report2 = Copy-Report (Invoke-Tester "run2") "run2"
            $m1 = Read-Metrics $report1
            $m2 = Read-Metrics $report2
            $stats1Path = Join-Path $OutDir "run1-stats.csv"
            $stats2Path = Join-Path $OutDir "run2-stats.csv"
            if (-not (Test-Path -LiteralPath $stats1Path) -or -not (Test-Path -LiteralPath $stats2Path)) {
              throw "P3: stats ausentes"
            }
            $s1 = Read-TextFile $stats1Path
            $s2 = Read-TextFile $stats2Path
            [System.IO.File]::WriteAllText($log, (Redact-Text (Read-TextFile $log)), $utf8)
            $payload1 = [ordered]@{
              run = "1"
              symbol = "EURUSD"
              period = "H1"
              model = 1
              from = "2024.01.02"
              to = "2024.02.02"
              trades = $m1.trades
              profit = $m1.profit
              drawdown = $m1.drawdown
              drawdown_label = $m1.drawdown_label
            }
            $payload2 = [ordered]@{
              run = "2"
              symbol = "EURUSD"
              period = "H1"
              model = 1
              from = "2024.01.02"
              to = "2024.02.02"
              trades = $m2.trades
              profit = $m2.profit
              drawdown = $m2.drawdown
              drawdown_label = $m2.drawdown_label
            }
            [System.IO.File]::WriteAllText((Join-Path $OutDir "run1.json"), (($payload1 | ConvertTo-Json) + "`n"), $utf8)
            [System.IO.File]::WriteAllText((Join-Path $OutDir "run2.json"), (($payload2 | ConvertTo-Json) + "`n"), $utf8)
            $same = ($m1.trades -eq $m2.trades) -and ($m1.profit -eq $m2.profit) -and ($m1.drawdown -eq $m2.drawdown) -and ($m1.drawdown_label -eq $m2.drawdown_label)
            $statsSame = Test-SameStats $s1 $s2
            $cmp = [ordered]@{
              equal = [bool]($same -and $statsSame)
              trades = $m1.trades
              profit = $m1.profit
              drawdown = $m1.drawdown
              stats_equal = [bool]$statsSame
            }
            [System.IO.File]::WriteAllText((Join-Path $OutDir "comparacao.json"), (($cmp | ConvertTo-Json) + "`n"), $utf8)
            if (-not $same) { throw "P3: os dois runs nao reproduziram profit, trades e drawdown" }
            if (-not $statsSame) { throw "P3: os stats dos dois runs nao sao iguais" }
            [System.IO.File]::WriteAllText((Join-Path $OutDir "resultado.txt"), "p3: relatorios reproduzidos`n", $utf8)
          } catch {
            $failed = $true
            $detail = (Redact-Text ([string]$_.Exception.Message)).Trim()
            if ([string]::IsNullOrWhiteSpace($detail)) { $detail = "erro sem detalhe redigido" }
            [System.IO.File]::WriteAllText((Join-Path $OutDir "resultado.txt"), ("p3: falhou`n{0}`n" -f $detail), $utf8)
            Write-Output $detail
          } finally {
            Stop-TerminalProcesses
            Get-Process -Name metaeditor64 -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            try { Write-P3Diagnostic } catch { Write-Output (Redact-Text ([string]$_.Exception.Message)) }
            try { Redact-OutDir } catch {
              $script:redactionUnsafe = $true
              Write-Output (Redact-Text ([string]$_.Exception.Message))
            }
            if ($script:redactionUnsafe) {
              $failed = $true
              $removed = $false
              try {
                if (Test-Path -LiteralPath $OutDir) {
                  Get-ChildItem -LiteralPath $OutDir -Force -Recurse -ErrorAction SilentlyContinue |
                    ForEach-Object { if (-not $_.PSIsContainer -and $_.IsReadOnly) { $_.IsReadOnly = $false } }
                  Remove-Item -LiteralPath $OutDir -Recurse -Force -ErrorAction Stop
                }
                $removed = -not (Test-Path -LiteralPath $OutDir)
              } catch {
                $removed = $false
              }
              if ($removed) {
                New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
                [System.IO.File]::WriteAllText((Join-Path $OutDir "resultado.txt"), "p3: falhou`nredacao do artefacto falhou`n", $utf8)
                Write-Manifest $OutDir
                Write-Output "p3: falhou"
                Write-Output "redacao do artefacto falhou"
              } else {
                Write-Output "P3: upload do artefacto bloqueado"
              }
            } else {
              if ($script:redactionRemoved) {
                $failed = $true
                [System.IO.File]::WriteAllText((Join-Path $OutDir "resultado.txt"), "p3: falhou`nredacao removeu ficheiro do artefacto`n", $utf8)
                Write-Output "p3: falhou"
                Write-Output "redacao removeu ficheiro do artefacto"
              }
              Write-Manifest $OutDir
            }
            if (Test-Path $PrivateDir) {
              Remove-Item $PrivateDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not $script:redactionUnsafe) {
            if ([string]::IsNullOrWhiteSpace($env:GITHUB_OUTPUT)) {
              throw "P3: GITHUB_OUTPUT ausente; artefacto nao confirmado"
            }
            "artifact_safe=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          }
          if ($failed) { exit 1 }

      - name: Artefactos P3
        if: always() && (steps.tester.outputs.artifact_safe == 'true' || steps.demo.outputs.skipped == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-strategy-tester
          path: artifacts/p3
          if-no-files-found: warn

      - name: Evidencia no log
        if: always()
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
          ARTIFACT_SAFE: ${{ steps.tester.outputs.artifact_safe }}
          DEMO_SKIPPED: ${{ steps.demo.outputs.skipped }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $showArtifact = ($env:ARTIFACT_SAFE -eq "true") -or ($env:DEMO_SKIPPED -eq "true")
          if (-not $showArtifact) {
            Write-Output "p3: artefacto retido (redacao nao confirmada)"
            exit 0
          }
          foreach ($name in @("MT5_DEMO_LOGIN", "MT5_DEMO_PASSWORD", "MT5_DEMO_SERVER")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrEmpty($value)) {
              Write-Output ("::add-mask::{0}" -f $value)
            }
          }
          function Hide([string]$text) {
            if ($null -eq $text) { return "" }
            foreach ($name in @("MT5_DEMO_LOGIN", "MT5_DEMO_PASSWORD", "MT5_DEMO_SERVER")) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if (-not [string]::IsNullOrEmpty($value) -and $value.Length -ge 3) {
                $text = $text.Replace($value, "[redacted]")
              }
            }
            return $text
          }
          $OutDir = Join-Path (Get-Location) "artifacts\p3"
          function Emit([string]$text) {
            $hidden = Hide $text
            foreach ($line in ($hidden -split '\r?\n')) {
              $drop = $false
              foreach ($secretName in @("MT5_DEMO_LOGIN", "MT5_DEMO_PASSWORD", "MT5_DEMO_SERVER")) {
                $value = [Environment]::GetEnvironmentVariable($secretName)
                if (-not [string]::IsNullOrEmpty($value) -and $line.Contains($value)) { $drop = $true; break }
              }
              if (-not $drop) { Write-Output $line }
            }
          }
          function Show-Artifact([string]$name) {
            $path = Join-Path $OutDir $name
            Write-Output ("----- {0} -----" -f $name)
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Output "ausente"
              return
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            Emit ([System.Text.Encoding]::UTF8.GetString($bytes))
          }
          Show-Artifact "installer-signature.txt"
          Show-Artifact "resultado.txt"
          Show-Artifact "diagnostico.txt"
          Show-Artifact "run1-stats.csv"
          Show-Artifact "run2-stats.csv"
          Show-Artifact "MANIFEST.sha256"
